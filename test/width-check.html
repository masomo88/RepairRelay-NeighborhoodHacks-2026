<!doctype html><html><meta charset="utf-8"><iframe id="app" src="../public/index.html" style="width:390px;height:844px"></iframe><pre id="result">RUNNING</pre>
<script>window.addEventListener('load',()=>{const d=document.getElementById('app').contentDocument;const w=d.defaultView.innerWidth;const bad=[...d.querySelectorAll('body *')].map(e=>({tag:e.tagName,cls:e.className,id:e.id,text:(e.textContent||'').slice(0,35),right:Math.round(e.getBoundingClientRect().right),width:Math.round(e.getBoundingClientRect().width)})).filter(x=>x.right>w+2).sort((a,b)=>b.right-a.right).slice(0,20);document.getElementById('result').textContent=JSON.stringify({w,scroll:d.documentElement.scrollWidth,bad});});</script></html>
